<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A1E"/>
      <stop offset="50%" stop-color="#0F1738"/>
      <stop offset="100%" stop-color="#1E124A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Center Left Chevron -->
    <linearGradient id="centerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Center Right Chevron -->
    <linearGradient id="centerRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#070A1E" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Sheen Gradient -->
    <linearGradient id="specularSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>
    
    <filter id="coreSpark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Ambient Glow & Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cosmicBg)" filter="url(#neonShadow)"/>
  
  <!-- Radial Core Light -->
  <circle cx="256" cy="256" r="180" fill="url(#coreAura)"/>
  
  <!-- Border Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGlow)" stroke-width="4"/>

  <!-- 2. "M" Neural Crest Wings -->
  <!-- Left Outer Wing -->
  <polygon points="82,360 82,160 166,116 166,306" fill="url(#wingLeft)" stroke="#C084FC" stroke-width="2"/>
  <polygon points="98,340 98,175 148,145 148,295" fill="#C084FC" fill-opacity="0.4"/>

  <!-- Right Outer Wing -->
  <polygon points="430,360 430,160 346,116 346,306" fill="url(#wingRight)" stroke="#C084FC" stroke-width="2"/>
  <polygon points="414,340 414,175 364,145 364,295" fill="#8B5CF6" fill-opacity="0.4"/>

  <!-- Center Chevrons -->
  <polygon points="166,116 256,268 256,346 166,198" fill="url(#centerLeft)" stroke="#E9D5FF" stroke-width="2"/>
  <polygon points="346,116 256,268 256,346 346,198" fill="url(#centerRight)" stroke="#E9D5FF" stroke-width="2"/>

  <!-- 3. Central Memory Core (Golden Diamond Spark) -->
  <g filter="url(#coreSpark)">
    <polygon points="256,182 284,220 256,258 228,220" fill="#FEF08A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="256" cy="220" r="7" fill="#FFFFFF"/>
  </g>

  <!-- 4. Constellation Nodes -->
  <circle cx="166" cy="116" r="9" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>
  <circle cx="346" cy="116" r="9" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>
  <circle cx="82" cy="160" r="8" fill="#FFFFFF" stroke="#A855F7" stroke-width="2.5"/>
  <circle cx="430" cy="160" r="8" fill="#FFFFFF" stroke="#A855F7" stroke-width="2.5"/>
  <circle cx="256" cy="346" r="9" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>

  <!-- 5. Glass Specular Sheen -->
  <path d="M 24 132 C 24 72 72 24 132 24 L 380 24 C 440 24 488 72 488 132 L 488 190 L 24 280 Z" fill="url(#specularSheen)" clip-path="url(#squircleClip)"/>
</svg>